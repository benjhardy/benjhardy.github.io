<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maxwell by Heart</title>
<meta name="description" content="Learn to write Maxwell's four equations from memory, with interactive fields for each law.">
<meta property="og:title" content="Maxwell by Heart">
<meta property="og:description" content="Learn to write Maxwell's four equations from memory, with interactive fields for each law.">
<meta property="og:image" content="https://benjhardy.github.io/2026/maxwell-by-heart/maxwell-by-heart.png">
<meta property="og:url" content="https://benjhardy.github.io/maxwell-by-heart/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Math&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: one calm column. Each step is one screen. Progress sticks to the top, Back/Next to the bottom.
   One accent per law: c1 Gauss E, c2 Gauss B, c3 Faraday, c4 Ampere-Maxwell. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#121721; --muted:#566070; --line:#D7DCE4; --faint:#E8ECF1;
  --c1:#B94C14; --c2:#2A5FC4; --c3:#8638BE; --c4:#08805D;
  --ok:#17773F; --bad:#C02B39; --focus:#2A5FC4;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Noto Sans Math","Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --a:var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F15; --surface:#151A23; --ink:#E6E9EF; --muted:#9AA3B3; --line:#2A313D; --faint:#1B212B;
    --c1:#FF8E57; --c2:#7AA8FF; --c3:#C696FF; --c4:#41D4A3; --ok:#52DB8C; --bad:#FF7381; --focus:#8DB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F15; --surface:#151A23; --ink:#E6E9EF; --muted:#9AA3B3; --line:#2A313D; --faint:#1B212B;
  --c1:#FF8E57; --c2:#7AA8FF; --c3:#C696FF; --c4:#41D4A3; --ok:#52DB8C; --bad:#FF7381; --focus:#8DB4FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
#app{max-width:760px;margin:0 auto;padding-inline:16px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.brand{font:800 15px/1 var(--f-display);letter-spacing:.01em}
.pbar{height:6px;border-radius:3px;background:var(--faint);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--a);transition:width .45s ease,background-color .3s}
#plabel{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;font:500 12px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
#plabel span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;padding-block:6px 28px;outline:none}
.nav{position:sticky;bottom:0;z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;min-height:46px;font:700 15px/1 var(--f-body);cursor:pointer;color:var(--ink);transition:background-color .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--a) 14%,var(--surface));border-color:var(--a)}
.btn.lg{min-height:54px;padding:14px 30px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.screen{display:flex;flex-direction:column;gap:18px;animation:in .28s ease both}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
.head{display:flex;flex-direction:column;gap:6px}
.stg{display:inline-flex;gap:10px;margin-left:14px}
.stg span{color:var(--muted);opacity:.7}
.stg span.on{color:var(--a);opacity:1;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.kicker{margin:0;font:600 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--a)}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em;outline:none}
h1{font-size:clamp(38px,10vw,64px);font-weight:800;line-height:1}
h2{font-size:clamp(26px,6.6vw,36px);font-weight:800;line-height:1.08;color:var(--a)}
h3{font-size:clamp(22px,5.6vw,30px);font-weight:800;line-height:1.1}
.say{margin:0;font:700 clamp(19px,4.8vw,23px)/1.3 var(--f-body);text-wrap:balance}
.lede{margin:0;font:700 clamp(20px,5vw,26px)/1.3 var(--f-body);max-width:30ch}
.small{margin:0;font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lbl{margin:0;font:600 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inst{margin:0;color:var(--muted);font-size:15px}

/* maths */
.m,.eq,.tile,.slot,.key{font-family:var(--f-math)}
.m b.v,.eq b.v,.tile b.v,.slot b.v,.key b.v{font-weight:600;font-style:normal}
.eq i,.m i,.tile i,.slot i,.key i{font-style:italic}
sup{font-size:.6em;line-height:0}
sub{font-size:.6em;vertical-align:-.32em;line-height:0;font-style:normal;font-family:var(--f-math)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.08;font-size:.8em;margin-inline:.06em}
.frac>span:first-child{border-bottom:.075em solid currentColor;padding-inline:.12em}
.isg{font-family:"Noto Sans Math","STIX Two Text","Cambria Math",serif;font-size:1.18em;line-height:1;margin-right:.02em}
.op{margin-left:.04em}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.14em .2em;line-height:1.35;min-width:0}
.eq.big{font-size:clamp(24px,6.6vw,36px)}
.eq.mid{font-size:clamp(18px,4.8vw,25px)}
.eq.sm{font-size:clamp(15px,3.9vw,19px)}
.t{display:inline-flex;align-items:center;white-space:nowrap}
.tk{display:inline-block;white-space:nowrap;line-height:1.2}
.eqs{margin-inline:.18em}
.hug{margin-left:-.12em}

/* decode */
.sym{appearance:none;border:0;background:none;padding:.04em .12em;border-radius:8px;cursor:help;font:inherit;color:inherit;display:inline-flex;align-items:center;white-space:nowrap}
.sym:hover,.sym.on{background:color-mix(in srgb,var(--a) 16%,transparent)}
.decode{display:flex;gap:14px;align-items:center;min-height:62px;padding:10px 14px;border-radius:12px;background:var(--faint)}
.decode .dsym{font-family:var(--f-math);font-size:28px;min-width:2.2em;text-align:center;color:var(--a);flex:none}
.decode .hint{color:var(--muted)}
.decode p{margin:0;font-size:15px;line-height:1.4}
.sayI{margin:0;font-weight:700}

/* exercises */
.slot{appearance:none;min-width:1.8em;min-height:1.55em;border:2px dashed var(--line);border-radius:10px;background:transparent;padding:.04em .22em;display:inline-flex;align-items:center;justify-content:center;font-size:inherit;cursor:pointer;color:var(--ink);transition:background-color .15s,border-color .15s}
.slot.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,transparent)}
.slot.hot{border-color:var(--a);border-style:solid;background:color-mix(in srgb,var(--a) 14%,transparent)}
.slot.ok{border:2px solid transparent;background:color-mix(in srgb,var(--a) 15%,transparent);cursor:default}
.slot.bad{border-color:var(--bad);border-style:solid;animation:shake .35s}
.slot.wrong{border:2px solid var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:14px;background:var(--faint);min-height:80px;align-items:center}
.tile{appearance:none;font-size:clamp(20px,5.4vw,26px);min-width:52px;min-height:52px;padding:4px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .1s,border-color .15s}
.tile:hover{border-color:var(--a)}
.tile.lift{opacity:.35}
.tile.spent{opacity:.35;cursor:default}
.tile.bad{border-color:var(--bad);animation:shake .35s}
.tile.eqt{font-size:clamp(15px,4vw,19px);padding:8px 12px}
.dghost{position:fixed;left:0;top:0;margin:0;pointer-events:none;z-index:100;box-shadow:0 10px 28px rgba(0,0,0,.22);border-color:var(--a)!important}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin:0;min-height:1.5em;font-weight:700;text-align:center}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.ex-rows{display:flex;flex-direction:column;gap:14px;align-items:center}
.exrow{justify-content:center}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--faint);border:1px solid var(--line)}
.dots i.on{background:var(--a);border-color:var(--a)}

/* visuals */
.vis{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.vis canvas{display:block;width:100%;height:auto;touch-action:none;cursor:default;max-width:100%}
.vis canvas:focus-visible{outline-offset:-3px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.read{display:flex;flex-wrap:wrap;gap:8px 22px;flex:1 1 auto}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--a)}
.kv b i{font-family:var(--f-math)}
.vhint{margin:0;font-size:13px;color:var(--muted);flex-basis:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);flex-basis:100%}
.legend i.sw{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.seg{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;border-radius:999px;padding:7px 14px;min-height:36px;font:700 14px/1 var(--f-body);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.atab{display:grid;gap:4px;flex-basis:100%;font-size:14px}
.atab div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--faint)}
.atab div.sum{border-bottom:0;font-weight:700}
.atab b{font:600 16px/1.2 var(--f-mono);white-space:nowrap}
.astat{margin:0;font-weight:700;flex-basis:100%}
.astat.ok{color:var(--ok)}
.astat.bad{color:var(--bad)}
input[type=range]{accent-color:var(--a);width:160px;max-width:100%}
.rng{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}

/* hook */
.hook{gap:22px;padding-top:10px}
.four{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.four li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.four li:last-child{border-bottom:0}
.four .nm{font:700 13px/1.2 var(--f-mono);letter-spacing:.04em;color:var(--a);text-transform:uppercase}
.byline{margin:0;font-size:13px;color:var(--muted)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qbar{flex:1;height:6px;border-radius:3px;background:var(--faint);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.qbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.qq{margin:0;font:700 19px/1.35 var(--f-body);text-wrap:balance;outline:none}
.tag{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--faint);color:var(--muted);margin-right:8px;vertical-align:3px}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px;color:var(--ink);min-width:0}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt[disabled]{cursor:default}
.spotrow{justify-content:center}
.spotb{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.06em .2em;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;min-height:1.5em}
.spotb:hover{border-color:var(--muted)}
.spotb.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.spotb.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fix{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px;border-radius:12px;background:var(--faint)}
.qnext{display:flex;justify-content:center}
.qhead{justify-content:center;padding:6px 0}

/* pattern */
.grid4{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}
.gh{text-align:center;font:600 22px/1 var(--f-math);padding:4px 0}
.gr{display:flex;flex-direction:column;justify-content:center;font:600 12px/1.25 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-right:4px}
.gr b{font:600 24px/1 var(--f-math);color:var(--ink);text-transform:none}
.slot.g{min-height:84px;width:100%;font-size:clamp(13px,3.4vw,18px);flex-direction:column;gap:4px;padding:8px 6px;line-height:1.3}
.slot.g .eq{justify-content:center}
.slot.g small{font:600 11px/1.2 var(--f-mono);letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
.sym4{width:100%;border-collapse:collapse;font-size:15px}
.sym4 th,.sym4 td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.sym4 th{font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sym4 td.m{font-size:19px;white-space:nowrap}
.sym4 tr:last-child td{border-bottom:0}
.sym4 .small{font-family:var(--f-body);font-size:13px;white-space:normal}
.tbl{overflow-x:auto}
.notes{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* match / map */
.mrow{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px 0;border-bottom:1px solid var(--faint)}
.mrow:last-child{border-bottom:0}
.slot.wide{width:100%;min-height:52px;font-size:clamp(15px,4vw,19px);justify-content:center}
.map{display:flex;flex-direction:column;gap:12px}
.map .pair{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.map .arr{font:600 13px/1 var(--f-mono);color:var(--muted)}
.thm{font-size:clamp(17px,4.4vw,22px);justify-content:center;padding:6px 0}

/* test */
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:.12em .18em;min-height:58px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--f-math);font-size:clamp(19px,5vw,26px);cursor:text;position:relative}
.line.act{border-color:var(--ink)}
.line .ph{font:400 14px/1 var(--f-body);color:var(--muted)}
.line.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.line.wrong{border-color:var(--bad)}
.line .mk{margin-left:auto;font:700 13px/1 var(--f-body);padding-left:8px}
.line.right .mk{color:var(--ok)}
.line.wrong .mk{color:var(--bad)}
.should{margin:-4px 0 4px;padding:8px 12px;border-radius:10px;background:var(--faint);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.kbd{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--faint)}
.krow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.key{appearance:none;min-width:48px;min-height:48px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line);font-size:clamp(18px,4.8vw,22px);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.key:active{transform:translateY(1px)}
.key.txt{font:700 14px/1 var(--f-body)}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.result{border-width:2px;border-color:var(--ink);gap:16px}
.score{margin:0;font:600 15px/1.3 var(--f-mono);color:var(--muted)}
.score b{font:800 40px/1 var(--f-display);color:var(--ink)}

/* bonus */
.wsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.wsteps li{display:flex;flex-direction:column;gap:8px;animation:in .3s ease both}
.wsteps p{margin:0}
.cval{font:700 clamp(22px,6vw,32px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}

@media (min-width:640px){
  .opts.two{grid-template-columns:1fr 1fr}
  .card{padding:22px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* primer: field playground and check */
.presets{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.presets .btn{min-height:38px;padding:7px 12px;font-size:14px}
.kv b.w{font-size:17px}
.mopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mopt{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font:700 14px/1.2 var(--f-body);min-width:0}
.mopt:hover{border-color:var(--muted)}
.mopt canvas,.qfig canvas{width:100%;max-width:130px;aspect-ratio:1/1;display:block}
.mopt.right,.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.mopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.mopt[disabled]{cursor:default}
.qgrid{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:12px;align-items:center}
.qgrid .opts{gap:8px}
.qgrid .opt{min-height:44px;padding:8px 12px;font-weight:700}
.qfig{border:1px solid var(--line);border-radius:12px;padding:4px}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">Maxwell by Heart</div>

/* ---------- drag + place engine (tap, drag, keyboard) ---------- */
function enableDrag(t,onDrop){
  t.addEventListener('click',e=>{if(t._noclick){e.stopImmediatePropagation();e.preventDefault()}},true);
  t.addEventListener('pointerdown',e=>{
    if(e.button!==0||t.hidden)return;
    const id=e.pointerId,sx=e.clientX,sy=e.clientY;let g=null,hot=null,ox=0,oy=0;
    const mv=ev=>{
      if(ev.pointerId!==id)return;
      if(!g){
        if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;
        const r=t.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
        g=t.cloneNode(true);g.removeAttribute('id');g.classList.add('dghost');g.setAttribute('aria-hidden','true');
        g.style.width=r.width+'px';g.style.height=r.height+'px';
        const host=t.closest('.screen')||document.body;g.style.setProperty('--a',getComputedStyle(t).getPropertyValue('--a'));
        document.body.appendChild(g);t.classList.add('lift');
      }
      ev.preventDefault();
      g.style.transform=`translate(${ev.clientX-ox}px,${ev.clientY-oy}px)`;
      const u=document.elementFromPoint(ev.clientX,ev.clientY);const s=u&&u.closest?u.closest('.slot'):null;
      if(s!==hot){if(hot)hot.classList.remove('hot');hot=s;if(hot)hot.classList.add('hot')}
    };
    const done=ev=>{
      if(ev.pointerId!==id)return;
      removeEventListener('pointermove',mv);removeEventListener('pointerup',done);removeEventListener('pointercancel',done);
      if(g){
        g.remove();t.classList.remove('lift');if(hot)hot.classList.remove('hot');
        t._noclick=true;setTimeout(()=>{t._noclick=false},120);
        if(ev.type==='pointerup')onDrop(document.elementFromPoint(ev.clientX,ev.clientY));
      }
    };
    addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',done);addEventListener('pointercancel',done);
  });
}
function placer({slots,tiles,accept,onPlace,onDone,fill}){
  let sel=null;
  const empty=()=>slots.find(s=>!s.filled);
  const select=s=>{sel=s||null;slots.forEach(x=>x.el.classList.toggle('sel',x===sel))};
  slots.forEach(s=>{s.el._slot=s;s.el.addEventListener('click',()=>{if(!s.filled)select(s)})});
  function place(tile,slot){
    if(!slot||slot.filled||tile.used)return;
    const ok=accept(slot,tile.val);
    if(ok){
      const hadFocus=document.activeElement===tile.el;
      slot.filled=true;slot.val=tile.val;tile.used=true;tile.el.hidden=true;
      if(fill)fill(slot,tile);else slot.el.innerHTML=tile.el.innerHTML;
      slot.el.classList.add('ok');slot.el.setAttribute('aria-label',(tile.el.getAttribute('aria-label')||'')+', placed');
      const n=empty();select(n);
      if(onPlace)onPlace(true,slot,tile);
      if(hadFocus){const nt=tiles.find(x=>!x.used);if(nt)nt.el.focus({preventScroll:true})}
      if(!n&&onDone)onDone();
    }else{
      flash(tile.el,'bad');flash(slot.el,'bad');
      if(onPlace)onPlace(false,slot,tile);
    }
  }
  tiles.forEach(t=>{
    enableDrag(t.el,target=>{const se=target&&target.closest?target.closest('.slot'):null;if(se&&se._slot&&slots.includes(se._slot))place(t,se._slot)});
    t.el.addEventListener('click',()=>place(t,sel||empty()));
  });
  select(empty());
  return {place};
}
function spent(bank){const left=$$('.tile',bank).filter(t=>!t.hidden);if(!left.length)bank.hidden=true;else left.forEach(t=>{t.disabled=true;t.classList.add('spent')})}
function fixedOk(row,seq){return seq.every((t,i)=>row.hidden.has(i)||t===row.seqs[0][i])}
function consistent(row,pos,val){return row.seqs.some(seq=>fixedOk(row,seq)&&seq[pos]===val&&row.slots.every(s=>!s.filled||seq[s.pos]===s.val))}
function expected(s){const r=s.row;const q=r.seqs.find(seq=>fixedOk(r,seq)&&r.slots.every(x=>!x.filled||seq[x.pos]===x.val))||r.seqs[0];return q[s.pos]}
const PAIRH={
 'div|curl':'Spread, not swirl. Use ∇·','curl|div':'Swirl, not spread. Use ∇×',
 'minus|plus':'Faraday needs the minus. The change is opposed.','plus|minus':'Here the two causes add: +',
 'dBdt|dEdt':'Here a changing B is the cause.','dEdt|dBdt':'Here a changing E is the cause.',
 'E|B':'This law is about E.','B|E':'This law is about B.','oe0|om0':'Electric law, electric constant: ε₀.',
 'zero|rho':'B has no charge to start from: 0.','rho|zero':'E does start on charge: ρ.','zero|oe0':'B has no source at all: 0.',
 'Qenc|mu0Ienc':'A closed surface holds charge: Q_enc.','mu0Ienc|Qenc':'A loop links current: μ₀I_enc.',
 'oiint|oint':'A closed surface: ∯.','oint|oiint':'A closed loop: ∮.',
 'iintEdA|iintBdA':'Maxwell’s term uses the flux of E.','iintBdA|iintEdA':'Faraday uses the flux of B.'
};
function hint(exp,got,row){
  if(PAIRH[exp+'|'+got])return PAIRH[exp+'|'+got];
  if(row.seqs[0].includes(got))return 'Right piece, wrong place.';
  return 'Not this one. Try again.';
}
/* rows: [{seqs,hidden:Set,k,col}] */
function exercise(box,rows,palette,opt){
  opt=opt||{};
  const rowsEl=$('.ex-rows',box),bank=$('.bank',box),fb=$('.fb',box);
  rowsEl.innerHTML='';bank.innerHTML='';fb.textContent='';fb.className='fb';
  const slots=[];let n=0;
  rows.forEach(r=>{
    const d=el('div','eq '+(opt.size||'big')+' exrow');if(r.col)d.style.setProperty('--a',`var(${r.col})`);
    r.slots=[];
    r.seqs[0].forEach((t,i)=>{
      if(r.hidden.has(i)){const b=el('button','slot');b.type='button';b.setAttribute('aria-label','Empty box '+(++n));const s={el:b,pos:i,row:r,filled:false};r.slots.push(s);slots.push(s);d.appendChild(b)}
      else d.insertAdjacentHTML('beforeend',tokSpan(t));
    });
    rowsEl.appendChild(d);
  });
  let pal=shuffle(palette);
  const canon=slots.map(s=>s.row.seqs[0][s.pos]).join();
  for(let i=0;i<6&&pal.join()===canon&&pal.length>1;i++)pal=shuffle(palette);
  const tiles=pal.map(v=>{const b=el('button','tile',T[v].h);b.type='button';b.setAttribute('aria-label',T[v].a);bank.appendChild(b);return{el:b,val:v}});
  placer({slots,tiles,accept:(s,v)=>consistent(s.row,s.pos,v),
    onPlace:(ok,s,t)=>{if(ok){fb.className='fb';fb.textContent=''}else{fb.className='fb bad';fb.textContent=hint(expected(s),t.val,s.row);miss(s.row.k)}},
    onDone:()=>{spent(bank);if(opt.onDone)opt.onDone(fb)}});
}

/* ---------- canvas plumbing ---------- */
let VIS=[];
const P={};
function readPal(){const cs=getComputedStyle(document.documentElement);['ink','muted','line','faint','surface','bg','c1','c2','c3','c4','ok','bad','focus'].forEach(k=>{P[k]=cs.getPropertyValue('--'+k).trim()||'#888888'});VIS.forEach(v=>v.o.dirty=true)}
function rgba(hex,a){let h=hex.replace('#','').trim();if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function mkCanvas(box,W,H,label,narrow){
  const cv=el('canvas');cv.tabIndex=0;cv.setAttribute('role','application');cv.setAttribute('aria-label',label);
  cv.style.aspectRatio=W+' / '+H;box.prepend(cv);
  const o={cv,ctx:cv.getContext('2d'),W,H,s:1,k:1,dirty:true};
  o.X0=0;o.X1=W;o.VW=W;
  o.fit=()=>{const w=cv.clientWidth||W;const nar=!!narrow&&w<520;o.X0=nar?narrow[0]:0;o.X1=nar?narrow[1]:W;o.VW=o.X1-o.X0;const ar=o.VW+' / '+H;if(cv.style.aspectRatio!==ar)cv.style.aspectRatio=ar;
    const d=Math.min(2,window.devicePixelRatio||1);o.s=w/o.VW;o.k=o.s*d;cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(w*H/o.VW*d));o.dirty=true};
  o.ro=new ResizeObserver(o.fit);o.ro.observe(cv);o.fit();
  o.begin=()=>{o.ctx.setTransform(o.k,0,0,o.k,-o.X0*o.k,0);o.ctx.clearRect(o.X0,0,o.VW,H)};
  o.pt=e=>{const r=cv.getBoundingClientRect();return{x:o.X0+(e.clientX-r.left)*o.VW/r.width,y:(e.clientY-r.top)*H/r.height}};
  o.tol=px=>px/Math.max(.2,o.s);
  o.fs=px=>Math.min(px/Math.max(.2,o.s),px*2);
  o.font=(px,w)=>`${w||600} ${o.fs(px)}px "IBM Plex Mono",ui-monospace,monospace`;
  cv.addEventListener('focus',()=>{o.dirty=true});cv.addEventListener('blur',()=>{o.dirty=true});
  return o;
}
function dragOn(o,{pick,move,end}){
  let cur=null;
  o.cv.addEventListener('pointerdown',e=>{const p=o.pt(e);cur=pick(p);if(cur){try{o.cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();o.cv.style.cursor='grabbing'}});
  o.cv.addEventListener('pointermove',e=>{const p=o.pt(e);if(cur){move(cur,p);o.dirty=true}else if(e.pointerType==='mouse')o.cv.style.cursor=pick(p,true)?'grab':'default'});
  const up=()=>{if(cur){if(end)end(cur);cur=null;o.cv.style.cursor='default';o.dirty=true}};
  o.cv.addEventListener('pointerup',up);o.cv.addEventListener('pointercancel',up);
}
function keysOn(o,h){
  o.cv.addEventListener('keydown',e=>{
    const st=e.shiftKey?30:10;let used=true;
    if(e.key==='ArrowLeft')h.move&&h.move(-st,0);else if(e.key==='ArrowRight')h.move&&h.move(st,0);
    else if(e.key==='ArrowUp')h.move&&h.move(0,-st);else if(e.key==='ArrowDown')h.move&&h.move(0,st);
    else if((e.key===' '||e.key==='Enter')&&h.next)h.next();
    else if((e.key==='+'||e.key==='=')&&h.size)h.size(10);else if(e.key==='-'&&h.size)h.size(-10);
    else used=false;
    if(used){e.preventDefault();o.dirty=true}
  });
}
function arrow(ctx,x1,y1,x2,y2,hd){
  const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hd*Math.cos(a-.5),y2-hd*Math.sin(a-.5));ctx.lineTo(x2-hd*Math.cos(a+.5),y2-hd*Math.sin(a+.5));ctx.closePath();ctx.fill();
}
function head(ctx,x,y,a,hd){ctx.beginPath();ctx.moveTo(x+hd*Math.cos(a),y+hd*Math.sin(a));ctx.lineTo(x-hd*Math.cos(a-.6),y-hd*Math.sin(a-.6));ctx.lineTo(x-hd*Math.cos(a+.6),y-hd*Math.sin(a+.6));ctx.closePath();ctx.fill()}

function readout(parent,items){const w=el('div','read');const m={};items.forEach(([lab,id])=>{const d=el('div','kv',`<span>${lab}</span><b></b>`);w.appendChild(d);m[id]=d.querySelector('b')});parent.appendChild(w);return m}

  opts.forEach(([v,l])=>{const b=el('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(v===cur));b.addEventListener('click',()=>{$$('button',s).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');on(v)});s.appendChild(b)});

function sign(n,d){const v=Number(n.toFixed(d));if(Math.abs(v)<Math.pow(10,-d)/2)return(0).toFixed(d);return(v>0?'+':'−')+Math.abs(v).toFixed(d)}

/* ---------- visual 1: Gauss E ---------- */
function visGaussE(box){
  const W=600,H=330;
  const o=mkCanvas(box,W,H,'Three charges and a closed surface. Drag a charge, or drag the circle. Drag the circle edge to resize. Keys: arrows move, Space picks the next item, plus and minus resize.',[90,510]);
  const Q=[{x:175,y:150,q:1},{x:480,y:95,q:1},{x:360,y:245,q:-1}];
  const Sf={x:205,y:165,r:92};let sel=0;
  const c=ctrlRow(box);const ro=readout(c,[['Charge inside','q'],['Net flux out','f']]);
  c.appendChild(el('p','vhint','Drag charges in and out. Drag the circle or its edge. 2-D slice: each dot is a line charge, q per metre; flux is per metre.'));
  const F=(x,y,s)=>{let ex=0,ey=0;for(const p of Q){const dx=x-p.x,dy=y-p.y,r2=dx*dx+dy*dy+s;ex+=p.q*dx/r2;ey+=p.q*dy/r2}return[ex,ey]};
  function flux(){let f=0;const N=1440;for(let i=0;i<N;i++){const th=i*2*Math.PI/N,nx=Math.cos(th),ny=Math.sin(th);const[ex,ey]=F(Sf.x+Sf.r*nx,Sf.y+Sf.r*ny,.25);f+=ex*nx+ey*ny}return f*Sf.r/N}
  dragOn(o,{pick:p=>{

    for(const m of mags){const x0=m.x-m.L/2,y0=yc-hh/2;x.fillStyle=rgba(P.muted,.22);x.fillRect(x0,y0,m.L/2,hh);x.fillStyle=rgba(P.c2,.30);x.fillRect(m.x,y0,m.L/2,hh);x.strokeStyle=rgba(P.ink,.5);x.lineWidth=1;x.strokeRect(x0,y0,m.L,hh);
      x.font=o.font(13,700);x.textAlign='center';x.textBaseline='middle';x.fillStyle=P.ink;x.fillText('S',x0+m.L/4,yc);x.fillText('N',m.x+m.L/4,yc);x.textBaseline='alphabetic'}

  }

function renderQuiz(e,s,items,title,sub){
  e.innerHTML=`<section class="screen"><div class="head"><p class="kicker" style="color:var(--muted)">Retrieval practice</p><h2 tabindex="-1" style="color:var(--ink)">${title}</h2><p class="say">${sub}</p></div>

  <div class="card" id="reveal" hidden>
    <p class="lbl">What drives each field</p>
    <div class="tbl"><table class="sym4"><thead><tr><th></th><th>E</th><th>B</th></tr></thead><tbody>
      <tr><th>Charge (∇·)</th><td class="m" style="color:var(--c1)">${eqInner(['rho','oe0'])}</td><td class="m" style="color:var(--c2)">0 <span class="small">no magnetic charge</span></td></tr>
      <tr><th>Other field changing (∇×)</th><td class="m" style="color:var(--c3)">${eqInner(['minus','dBdt'])}</td><td class="m" style="color:var(--c4)">${eqInner(['plus','mu0e0','dEdt'])}</td></tr>
      <tr><th>Current (∇×)</th><td class="m" style="color:var(--c3)">0 <span class="small">no magnetic current</span></td><td class="m" style="color:var(--c4)">${eqInner(['mu0J'])}</td></tr>
    </tbody></table></div>
    <p class="small">Right sides in order: <b>charge, nothing, minus B-change, current plus E-change.</b></p>
  </div></section>`;
  const slots=$$('.slot.g',e).map(b=>({el:b,k:+b.dataset.k,filled:false}));
  const bank=$('.bank',e),fb=$('.fb',e);
  const tiles=shuffle([0,1,2,3]).map(k=>{const b=el('button','tile eqt',`<span class="eq">${eqInner(D(k))}</span>`);b.type='button';b.style.setProperty('--a',`var(${EQ[k].col})`);b.setAttribute('aria-label',EQ[k].full+': '+eqAria(D(k)));bank.appendChild(b);return{el:b,val:k}});
  const cap=['charge','nothing','−(B change)','current + (E change)'];
  placer({slots,tiles,accept:(sl,v)=>sl.k===v,fill:(sl,t)=>{sl.el.innerHTML=`<span class="eq">${eqInner(D(t.val))}</span><small>${cap[t.val]}</small>`},
    onPlace:(ok,sl,t)=>{if(ok){fb.className='fb';fb.textContent=''}else{fb.className='fb bad';const isDiv=t.val<2,wantDiv=sl.k<2;fb.textContent=isDiv!==wantDiv?(isDiv?'That one spreads (∇·). It goes in the top row.':'That one swirls (∇×). It goes in the bottom row.'):'Right row. Check which field it is about.';miss(t.val)}},
    onDone:()=>{spent(bank);fb.className='fb ok';fb.textContent='Sorted.';$('#reveal',e).hidden=false;say('Sorted. A table of what drives each field is now shown.');markDone(s)}});
}

/* theorems */
function renderThm(e){
  const F=V('F');
  const TH={div:{f:`${BIG('∭')}${sub('V')} (∇·${F}) d<i>V</i> <span class="eqs">=</span> ${BIG('∯')}${sub('S')} ${F}·d${V('A')}`,say:'Add up the spread in every small cell. Inner faces cancel. Only flux out of the skin is left.',pairs:[0,1]},
            curl:{f:`${BIG('∬')}${sub('S')} (∇×${F})·d${V('A')} <span class="eqs">=</span> ${BIG('∮')}${sub('C')} ${F}·d${V('l')}`,say:'Add up the swirl in every small cell. Inner edges cancel. Only the rim is left.',pairs:[2,3]}};
  e.innerHTML=`<section class="screen"><div class="head"><p class="kicker" style="color:var(--muted)">From point to region</p><h2 tabindex="-1" style="color:var(--ink)">Two theorems link the forms</h2><p class="say" id="thsay"></p></div>
    <div class="vis" id="vis"></div>
    <div class="card"><p class="lbl" id="thname"></p><div class="eq thm" id="thf"></div><div class="map" id="thmap"></div>
    <p class="small">∭<i>ρ</i> d<i>V</i> = <i>Q</i><sub>enc</sub> · ∬<b>J</b>·d<b>A</b> = <i>I</i><sub>enc</sub> · ∬<b>F</b>·d<b>A</b> = flux Φ</p></div></section>`;
  const set=m=>{const t=TH[m];setT($('#thname',e),m==='div'?'Divergence theorem':'Stokes’ theorem');$('#thf',e).innerHTML=`<span class="tk">${t.f}</span>`;setT($('#thsay',e),t.say);
    $('#thmap',e).innerHTML=t.pairs.map(k=>`<div class="pair" style="--a:var(${EQ[k].col})"><span class="eq sm" style="color:var(--a)">${eqInner(D(k))}</span><span class="arr">becomes</span><span class="eq sm">${eqInner(IF(k))}</span></div>`).join('')};
  set('div');
  VIS.push(visThm($('#vis',e),set));
}

/* match differential to integral */
function renderMatch(e,s){
  e.innerHTML=`<section class="screen"><div class="head"><p class="kicker" style="color:var(--muted)">Integral forms</p><h2 tabindex="-1" style="color:var(--ink)">Match each law to its integral form</h2><p class="say">∇· goes with ∯. ∇× goes with ∮.</p></div>
  <div class="card ex"><div id="mrows"></div><div class="bank" role="group" aria-label="Integral forms"></div><p class="fb" aria-live="polite"></p></div></section>`;
  const rows=$('#mrows',e);
  EQ.forEach(q=>rows.insertAdjacentHTML('beforeend',`<div class="mrow" style="--a:var(${q.col})"><span class="eq mid" style="color:var(--a)" aria-label="${eqAria(D(q.k))}">${eqInner(D(q.k))}</span><button type="button" class="slot wide" data-k="${q.k}" aria-label="Empty box for ${q.full}"></button></div>`));
  const slots=$$('.slot',rows).map(b=>({el:b,k:+b.dataset.k,filled:false}));
  const bank=$('.bank',e),fb=$('.fb',e);
  const tiles=shuffle([0,1,2,3]).map(k=>{const b=el('button','tile eqt',`<span class="eq">${eqInner(IF(k))}</span>`);b.type='button';b.setAttribute('aria-label',eqAria(IF(k)));bank.appendChild(b);return{el:b,val:k}});
  placer({slots,tiles,accept:(sl,v)=>sl.k===v,onPlace:(ok,sl,t)=>{if(ok){fb.className='fb';fb.textContent=''}else{fb.className='fb bad';fb.textContent=(sl.k<2)!==(t.val<2)?(sl.k<2?'∇· needs a closed surface ∯.':'∇× needs a closed loop ∮.'):'Right shape. Check the field and the right side.';miss(sl.k)}},
    onDone:()=>{spent(bank);fb.className='fb ok';fb.textContent='All four matched.';say('All four matched.');markDone(s)}});
}
function renderIRecall(e,s){
  e.innerHTML=`<section class="screen"><div class="head"><p class="kicker" style="color:var(--muted)">Integral forms</p><h2 tabindex="-1" style="color:var(--ink)">Fill the integral forms</h2><p class="say">Closed surface or closed loop? Then the right side.</p></div>${exCard()}</section>`;
  const rows=EQ.map(q=>({seqs:q.i,hidden:new Set(q.hideI),k:q.k,col:q.col}));
  const pal=[];EQ.forEach(q=>q.hideI.forEach(i=>pal.push(IF(q.k)[i])));pal.push('iintBdA','plus','rho');
  exercise($('.ex',e),rows,pal,{size:'mid',onDone:fb=>{fb.className='fb ok';fb.textContent='All four integral forms done.';say('Done.');markDone(s)}});
}

/* final test */
const KD=['div','curl','E','B','eq','rho','oe0','om0','zero','minus','plus','dBdt','dEdt','mu0J','mu0e0'];
const KI=['oiint','oint','EdA','BdA','Edl','Bdl','Qenc','mu0Ienc','ddt','iintBdA','iintEdA'];
/* accepted: the listed orderings, each also with its two sides swapped */
function variants(seqs){const out=[];seqs.forEach(sq=>{out.push(sq);const j=sq.indexOf('eq');if(j>0)out.push(sq.slice(j+1).concat(['eq'],sq.slice(0,j)))});return out}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[m][n]}
function renderTest(e,s){
  e.innerHTML=`<section class="screen"><div class="head"><p class="kicker" style="color:var(--muted)">Final test</p><h2 tabindex="-1" style="color:var(--ink)">Write all four</h2><p class="say">From memory. Any order. No hints.</p><p class="small">Either side of = may come first.</p></div>
  <div class="card">
    <div class="lines" id="lnD"></div>
    <label class="chk"><input type="checkbox" id="bonusI"> Add the integral forms too (bonus)</label>
    <div class="lines" id="lnI" hidden></div>
    <div class="kbd" role="group" aria-label="Equation keys"><div class="krow" id="kD"></div><div class="krow" id="kI" hidden></div>
      <div class="krow"><button type="button" class="key txt" id="kBk" aria-label="Delete last piece">⌫ Delete</button><button type="button" class="key txt" id="kNl">Next line ↵</button></div></div>
    <button type="button" class="btn primary lg" id="check">Check my answers</button>
  </div><div id="result"></div></section>`;
  const t0=performance.now();
  const lines=[[],[],[],[],[],[],[],[]];let act=0,bonus=false,graded=false;
  const lnD=$('#lnD',e),lnI=$('#lnI',e);
  for(let i=0;i<8;i++){const d=el('div','line');d.tabIndex=0;d.setAttribute('role','button');d.dataset.i=i;(i<4?lnD:lnI).appendChild(d);
    d.addEventListener('click',()=>{act=i;paint()});d.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act=i;paint()}})}
  function paint(){
    $$('.line',e).forEach(d=>{const i=+d.dataset.i,ln=lines[i];d.classList.toggle('act',i===act);
      d.innerHTML=ln.length?eqInner(ln):`<span class="ph">${i<4?'Law '+(i+1):'Integral form '+(i-3)}</span>`;
      d.setAttribute('aria-label',(i<4?'Line '+(i+1):'Integral line '+(i-3))+(i===act?', active':'')+': '+(ln.length?eqAria(ln):'empty'))});
    $$('.should',e).forEach(x=>x.remove());if(graded){graded=false;$$('.line',e).forEach(d=>d.classList.remove('right','wrong'))}
  }
  const mkKeys=(host,ks)=>ks.forEach(k=>{const b=el('button','key',T[k].h);b.type='button';b.setAttribute('aria-label','Add '+T[k].a);host.appendChild(b);b.addEventListener('click',()=>{if(lines[act].length<12)lines[act].push(k);paint()})});
  mkKeys($('#kD',e),KD);mkKeys($('#kI',e),KI);
  $('#kBk',e).addEventListener('click',()=>{lines[act].pop();paint()});
  $('#kNl',e).addEventListener('click',()=>{const max=bonus?8:4;act=(act+1)%max;paint()});
  $('#bonusI',e).addEventListener('change',ev=>{bonus=ev.target.checked;lnI.hidden=!bonus;$('#kI',e).hidden=!bonus;if(!bonus&&act>3)act=0;paint()});
  e.querySelector('.card').addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(ev.key==='Backspace'){ev.preventDefault();lines[act].pop();paint()}});
  paint();
  function grade(){
    const res={d:0,i:0,missing:[]};
    const out=[];
    ['d','i'].forEach(form=>{
      if(form==='i'&&!bonus)return;
      const base=form==='d'?0:4,used=new Set(),bad=[];
      for(let li=base;li<base+4;li++){const ln=lines[li];let hit=-1;
        for(const q of EQ){if(used.has(q.k))continue;if(variants(q[form]).some(sq=>sq.join()===ln.join())){hit=q.k;break}}
        if(hit>=0){used.add(hit);res[form]++;out.push({li,ok:true,k:hit})}else bad.push(li)}
      bad.forEach(li=>{let best=-1,bd=1e9;EQ.forEach(q=>{if(used.has(q.k))return;const dd=lev(lines[li],q[form][0]);if(dd<bd){bd=dd;best=q.k}});if(best>=0){used.add(best);out.push({li,ok:false,k:best,form})}});
      EQ.forEach(q=>{if(!used.has(q.k)&&form==='d')res.missing.push(q.k)});
      out.filter(o=>!o.ok&&o.form==='d').forEach(o=>res.missing.push(o.k));
    });
    return{res,out};
  }
  $('#check',e).addEventListener('click',()=>{
    const{res,out}=grade();graded=true;
    $$('.should',e).forEach(x=>x.remove());
    out.forEach(o=>{const d=$(`.line[data-i="${o.li}"]`,e);d.classList.add(o.ok?'right':'wrong');d.insertAdjacentHTML('beforeend',`<span class="mk">${o.ok?'✓ '+EQ[o.k].short:'✗'}</span>`);
      if(!o.ok){const form=o.li<4?'d':'i';d.insertAdjacentElement('afterend',el('div','should',`<span class="lbl">${EQ[o.k].short}</span><span class="eq sm">${eqInner(EQ[o.k][form][0])}</span>`))}});
    const secs=Math.round((performance.now()-t0)/1000),tm=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
    const all=res.d===4;S.best=Math.max(S.best,res.d);persist();
    const miss=[...new Set(res.missing)];
    $('#result',e).innerHTML=`<div class="card result"><p class="kicker" style="color:var(--muted)">Your result</p>
      <h3 tabindex="-1">${all?'You know Maxwell’s equations.':res.d+' of 4. One more pass.'}</h3>
      <p class="score"><b>${res.d}</b>/4 laws${bonus?` · <b>${res.i}</b>/4 integral bonus`:''}</p>
      ${fourList('d')}${bonus||all?fourList('i'):''}
      <p class="small">Written from memory in ${tm}.</p>
      ${miss.length?`<div class="row"><span class="small">Practise:</span>${miss.map(k=>`<button type="button" class="btn sm" data-go="recall${k}" style="--a:var(${EQ[k].col})">${EQ[k].full}</button>`).join('')}</div>`:''}
      <div class="row"><button type="button" class="btn" id="retry">Try again</button><button type="button" class="btn primary" id="tobonus">Bonus: light falls out</button></div></div>`;
    $$('[data-go]',e).forEach(b=>b.addEventListener('click',()=>go(IDX(b.dataset.go))));
    $('#retry',e).addEventListener('click',()=>go(S.i));
    $('#tobonus',e).addEventListener('click',()=>go(IDX('bonus')));
    const h=$('#result h3',e);h.focus({preventScroll:true});h.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
    say(all?'You know Maxwell’s equations.':res.d+' of 4 correct.');
  });
}

/* bonus */
function renderBonus(e){
  const mu0=1.25663706212e-6,e0=8.8541878128e-12,c=1/Math.sqrt(mu0*e0);
  const d2E=FR('∂²'+V('E'),'∂'+I_('t')+'²');
  e.innerHTML=`<section class="screen"><div class="head"><p class="kicker" style="color:var(--muted)">Bonus</p><h2 tabindex="-1" style="color:var(--ink)">Light falls out</h2><p class="say">Remove all charge and current. A wave is left.</p></div>
  <div class="vis" id="vis"></div>
  <div class="card"><ol class="wsteps">
    <li><p>Empty space: <span class="m"><i>ρ</i> = 0</span> and <span class="m"><b class="v">J</b> = 0</span>.</p><div class="eq sm">${eqInner(['div','E','eq','zero'])}<span class="t">&emsp;</span>${eqInner(['div','B','eq','zero'])}</div><div class="eq sm">${eqInner(['curl','E','eq','minus','dBdt'])}<span class="t">&emsp;</span>${eqInner(['curl','B','eq','mu0e0','dEdt'])}</div></li>
    <li hidden><p>Take the curl of Faraday. Put in Ampère–Maxwell.</p><div class="eq sm"><span class="t">∇×(∇×${V('E')})</span><span class="eqs">=</span><span class="t">−${FR('∂','∂'+I_('t'))}(∇×${V('B')})</span><span class="eqs">=</span><span class="t">−${T.mu0e0.h}${d2E}</span></div><p class="small">Also <span class="m">∇×(∇×<b class="v">E</b>) = ∇(∇·<b class="v">E</b>) − ∇²<b class="v">E</b> = −∇²<b class="v">E</b></span>, because <span class="m">∇·<b class="v">E</b> = 0</span>.</p></li>
    <li hidden><p>A wave equation:</p><div class="eq mid"><span class="t">∇²${V('E')}</span><span class="eqs">=</span><span class="t">${T.mu0e0.h}${d2E}</span></div><p>Its speed:</p><div class="eq mid"><span class="t"><i>c</i></span><span class="eqs">=</span><span class="t">1/√(${T.mu0e0.h})</span><span class="eqs">=</span><span class="cval">${Math.round(c).toLocaleString('en-US')} m/s</span></div><p class="small">From <span class="m"><i>μ</i><sub>0</sub> = 1.25663706212 × 10<sup>−6</sup></span> H/m and <span class="m"><i>ε</i><sub>0</sub> = 8.8541878128 × 10<sup>−12</sup></span> F/m (CODATA 2018). Today this is a consistency check: <i>c</i> has been exact since 1983, μ<sub>0</sub> has been measured since the 2019 SI revision, and ε<sub>0</sub> = 1/(μ<sub>0</sub><i>c</i>²).</p><p><b>Maxwell (1862) put in the measured ratio of electric to magnetic units (Weber and Kohlrausch, 1856), got this speed, and saw that it matched light. Light is an electromagnetic wave.</b></p></li>
  </ol><div class="row"><button type="button" class="btn primary" id="wnext">Next step</button><button type="button" class="btn" id="again">Start over</button></div></div>
  </section>`;
  let k=0;const lis=$$('.wsteps li',e);
  $('#wnext',e).addEventListener('click',ev=>{k++;if(k<lis.length)lis[k].hidden=false;if(k>=lis.length-1){ev.target.hidden=true;say('The speed is '+Math.round(c)+' metres per second, the speed of light.')}});
  $('#again',e).addEventListener('click',()=>go(0));
  VIS.push(visWave($('#vis',e),c));
}

/* ---------- boot ---------- */
readPal();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readPal);
new MutationObserver(readPal).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>VIS.forEach(v=>v.o.dirty=true));
let last=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;for(const v of VIS){try{if(v.step)v.step(dt);if(v.o.dirty){v.o.dirty=false;v.draw()}}catch(err){console.error(err)}}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
{const j=IDX(location.hash.slice(1));go(j>=0?j:0,false)}
addEventListener('hashchange',()=>{const j=IDX(location.hash.slice(1));if(j>=0&&j!==S.i)go(j)});
})();
</script>
